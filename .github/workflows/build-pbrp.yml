name: Build PBRP begonia from latest source

on:
  push:
    branches: [ twrp-12.1, fix/begonia-splash-hang ]
  workflow_dispatch:
    inputs:
      variant:
        description: 'Recovery fstab variant'
        type: choice
        options:
          - safe
          - static
          - dynamic
        default: safe
      crypto:
        description: 'Enable the vendor MicroTrust FBE/keymaster stack'
        type: boolean
        default: false

concurrency:
  group: pbrp-begonia-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      ALLOW_MISSING_DEPENDENCIES: true
      LC_ALL: C
      PBRP_VARIANT: ${{ inputs.variant || 'safe' }}
      PBRP_ENABLE_CRYPTO: ${{ inputs.crypto && 'true' || 'false' }}
      BUILD_ROOT: ${{ github.workspace }}/pbrp-build
    steps:
      - name: Checkout begonia device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup build environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev liblz4-tool libncurses5 lib32ncurses5-dev \
            libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush \
            rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 \
            python-is-python3 openjdk-11-jdk-headless
          df -h

      - name: Configure repo tool
        run: |
          git config --global user.name "PBRP CI"
          git config --global user.email "ci@begonia.local"
          git config --global color.ui false
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: |
            ccache-

      - name: Initialize PBRP build tree
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          rm -rf "$BUILD_ROOT"
          mkdir -p "$BUILD_ROOT"
          cd "$BUILD_ROOT"
          echo "Initializing upstream PBRP manifest in $BUILD_ROOT..."
          timeout 5m repo init --depth=1 \
            -u https://github.com/PitchBlackRecoveryProject/manifest_pb.git \
            -b android-12.1
          echo "Syncing upstream PBRP build tree (this can take several minutes)..."
          sync_pid=""
          timeout 20m repo sync -c -j4 --no-clone-bundle --no-tags &
          sync_pid=$!
          while kill -0 "$sync_pid" 2>/dev/null; do
            sleep 60
            echo "repo sync is still running (elapsed time is being watched)"
          done
          wait "$sync_pid"
          echo "Upstream PBRP build tree synced."

          # Sync the stock manifest first, then replace only the recovery
          # project with the reviewed source fork. This avoids a local
          # manifest override, which can make repo retry indefinitely.
          rm -rf bootable/recovery
          echo "Cloning pacman-Sy/android_bootable_recovery:android-12.1..."
          git clone --depth=1 --branch android-12.1 \
            https://github.com/pacman-Sy/android_bootable_recovery.git \
            bootable/recovery
          test -f bootable/recovery/partitionmanager.cpp
          grep -Fq 'Timed out waiting for logical partition' \
            bootable/recovery/partitionmanager.cpp
          grep -Fq 'Unable to mount metadata key directory; skipping metadata FBE decryption' \
            bootable/recovery/partitionmanager.cpp
          echo "Recovery source: $(git -C bootable/recovery rev-parse HEAD)"

      - name: Copy begonia device tree
        run: |
          set -euo pipefail
          rm -rf "$BUILD_ROOT/device/xiaomi/begonia"
          mkdir -p "$BUILD_ROOT/device/xiaomi"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='pbrp-build' \
            "$GITHUB_WORKSPACE/" \
            "$BUILD_ROOT/device/xiaomi/begonia/"
          test -f "$BUILD_ROOT/device/xiaomi/begonia/BoardConfig.mk"

      - name: Select recovery fstab
        id: fstab
        run: |
          set -euo pipefail
          VARIANT="${PBRP_VARIANT:-safe}"
          CRYPTO="${PBRP_ENABLE_CRYPTO:-false}"
          if [ "$CRYPTO" != true ] && [ "$VARIANT" != safe ]; then
            echo "::error::no-crypto builds support only the safe variant"
            exit 1
          fi
          if [ "$CRYPTO" = true ] && [ "$VARIANT" = safe ]; then
            echo "::error::crypto builds require static or dynamic"
            exit 1
          fi
          test -f "$GITHUB_WORKSPACE/variants/recovery.fstab.$VARIANT"
          echo "variant=$VARIANT" >> "$GITHUB_OUTPUT"
          echo "crypto=$CRYPTO" >> "$GITHUB_OUTPUT"

      - name: Install selected fstab
        run: |
          set -euo pipefail
          VARIANT="${{ steps.fstab.outputs.variant }}"
          cp "$GITHUB_WORKSPACE/variants/recovery.fstab.$VARIANT" \
            "$BUILD_ROOT/device/xiaomi/begonia/recovery/root/system/etc/recovery.fstab"

      - name: Setup build
        run: |
          cd "$BUILD_ROOT"
          source build/envsetup.sh
          lunch pb_begonia-eng

      - name: Build recovery image
        run: |
          cd "$BUILD_ROOT"
          source build/envsetup.sh
          lunch pb_begonia-eng
          mka recoveryimage

      - name: Create flashable zip
        if: success()
        run: |
          set -euo pipefail
          cd "$BUILD_ROOT"
          OUT_DIR="$BUILD_ROOT/out/target/product/begonia"
          RECOVERY_IMG="$OUT_DIR/recovery.img"
          VARIANT="${PBRP_VARIANT:-safe}"
          CRYPTO_LABEL=nocrypto
          [ "${PBRP_ENABLE_CRYPTO:-false}" = true ] && CRYPTO_LABEL=crypto
          test -f "$RECOVERY_IMG"
          rm -rf "$BUILD_ROOT/flashable_zip"
          mkdir -p "$BUILD_ROOT/flashable_zip/META-INF/com/google/android"
          cp "$RECOVERY_IMG" "$BUILD_ROOT/flashable_zip/"
          echo 'ui_print("Installing PBRP recovery...");' > "$BUILD_ROOT/flashable_zip/META-INF/com/google/android/updater-script"
          echo 'package_extract_file("recovery.img", "/dev/block/bootdevice/by-name/recovery");' >> "$BUILD_ROOT/flashable_zip/META-INF/com/google/android/updater-script"
          echo 'ui_print("Done!");' >> "$BUILD_ROOT/flashable_zip/META-INF/com/google/android/updater-script"
          printf '#!/system/bin/sh\n' > "$BUILD_ROOT/flashable_zip/META-INF/com/google/android/update-binary"
          chmod +x "$BUILD_ROOT/flashable_zip/META-INF/com/google/android/update-binary"
          ZIP_NAME="PBRP-begonia-${VARIANT}-${CRYPTO_LABEL}.zip"
          (cd "$BUILD_ROOT/flashable_zip" && zip -r "$BUILD_ROOT/$ZIP_NAME" .)
          mv "$BUILD_ROOT/$ZIP_NAME" "$OUT_DIR/"

      - name: Write build info
        if: success()
        run: |
          {
            echo "PBRP begonia build"
            echo "device-tree: $GITHUB_SHA"
            echo "source: pacman-Sy/android_bootable_recovery:android-12.1"
            echo "variant: ${PBRP_VARIANT:-safe}"
            echo "crypto: ${PBRP_ENABLE_CRYPTO:-false}"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$BUILD_ROOT/out/target/product/begonia/BUILD_INFO.txt"
          cat "$BUILD_ROOT/out/target/product/begonia/BUILD_INFO.txt"

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PBRP-begonia-${{ steps.fstab.outputs.variant }}-${{ env.PBRP_ENABLE_CRYPTO == 'true' && 'crypto' || 'nocrypto' }}
          path: |
            pbrp-build/out/target/product/begonia/recovery.img
            pbrp-build/out/target/product/begonia/PBRP-begonia-*.zip
            pbrp-build/out/target/product/begonia/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
